# CI gate for pushes/PRs — SQLite + Postgres (pgvector) matrix, uv + pytest.
# Bundled sample DBs are pulled from the public `bundled-dbs` GitHub release
# (gzipped assets) so the DB-dependent integration tests run here too.
# Refresh the assets with: gh release upload bundled-dbs <file>.sqlite.gz --clobber
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        # pgvector image required: migration 2026_04_27_0003 runs CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: insightxpert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SESSION_SECRET: ci-test-secret-at-least-32-bytes-long
      GEMINI_API_KEY: ci-placeholder-not-used-in-unit-tests
      DATABASE_URL: >-
        ${{
          matrix.db == 'postgres'
          && 'postgresql+psycopg://postgres:test@localhost:5432/insightxpert'
          || 'sqlite:///./ci-test.db'
        }}

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Fetch bundled sample DBs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Databases/_shared
          gh release download bundled-dbs --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sqlite.gz' --dir Databases/_shared --clobber
          gunzip -f Databases/_shared/*.sqlite.gz
          ls -la Databases/_shared

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q
